[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicfinder"
version = "0.1.0"
description = "Evidence-based music recommender that learns from your Spotify listening history"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sideband = "musicfinder.cli:main"
musicfinder = "musicfinder.cli:main"

[tool.setuptools.packages.find]
include = ["musicfinder*"]

[tool.setuptools.package-data]
musicfinder = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
